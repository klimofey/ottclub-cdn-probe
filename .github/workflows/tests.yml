name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the network-free logic runs here: parsing, statistics, retention,
      # benching. Anything touching the provider needs real credentials.
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -q
